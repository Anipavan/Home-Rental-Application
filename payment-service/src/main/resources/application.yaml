server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: HRA-payment-service

  # Default to dev profile — see auth-service/application.yaml for
  # the full rationale. Prod set SPRING_PROFILES_ACTIVE=prod (or any
  # non-dev value) and supply real env vars.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Multipart / file-upload sizing. Spring Boot's defaults cap a
  # single file at 1 MB and a request at 10 MB — the payment-proof
  # upload endpoint accepts up to 5 MB per screenshot, so those
  # defaults reject valid uploads with HTTP 500 before the
  # controller even sees the file. Bumped to 10 MB per file /
  # 12 MB per request so the service-layer check
  # (MAX_PROOF_BYTES = 5 MB) is the actual enforcer + returns a
  # readable "File exceeds 5 MB" 400 instead of a Spring stack
  # trace.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
    username: ${DB_USERNAME:siva}
    # Hard placeholder — SecretsBootstrapValidator refuses this in prod.
    password: ${DB_PASSWORD:CHANGE_ME_LOCAL_DEV_PLACEHOLDER}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000


  # Flyway - disabled by default so local dev keeps using Hibernate
  # ddl-auto=update for fast iteration. application-prod.yaml flips
  # spring.flyway.enabled=true and locks ddl-auto to 'validate'.
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Pre-Flyway baseline (Hibernate-managed)"
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 25

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: hra-payment-service
      auto-offset-reset: earliest
      # Wrap with ErrorHandlingDeserializer so a poison-pill record is logged
      # & skipped instead of killing the listener container.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.spa.home_rental_application.KafkaEvents.*"
        spring.json.use.type.headers: false

# Bound by KafkaTopicProperties (in KafkaEvents shared lib)
app:
  internal-auth:
    enabled: ${INTERNAL_AUTH_ENABLED:true}
    secret: ${INTERNAL_AUTH_SECRET:CHANGE_ME_LOCAL_DEV_INTERNAL_AUTH_SECRET_PLACEHOLDER_AT_LEAST_32_BYTES_LONG}
    allowed-clock-skew-seconds: 60

  kafka:
    property-topic: property-events
    user-topic: user-events
    payment-topic: payment-events
    maintenance-topic: maintenance-events
    notification-topic: notification-events
    auth-topic: auth-events

  payment:
    # Active gateway implementation: mock (dev + tests) | cashfree (prod
    # once Phase 3 of the Easy Split rollout lands). The razorpay option
    # was removed alongside the Route scaffolding — Cashfree Easy Split
    # is the chosen split-payment provider going forward.
    gateway: ${PAYMENT_GATEWAY:mock}
    # Late-fee policy
    late-fee-percent-per-week: ${LATE_FEE_PCT:2.0}
    max-late-fee-percent: ${MAX_LATE_FEE_PCT:10.0}
    # Reminder schedule: send a reminder N days before due date
    reminder-days-before-due: ${REMINDER_DAYS:3}

  # Cashfree credentials are consumed once the CashfreePaymentGateway
  # bean lands in Phase 3 of the plan. Values set here become active
  # the instant PAYMENT_GATEWAY=cashfree is flipped on. Placeholder
  # defaults keep the yaml self-documenting; SecretsBootstrapValidator
  # will refuse them outside dev profiles.
  cashfree:
    app-id: ${CASHFREE_APP_ID:CHANGE_ME_CASHFREE_APP_ID_PLACEHOLDER}
    secret-key: ${CASHFREE_SECRET_KEY:CHANGE_ME_CASHFREE_SECRET_KEY_PLACEHOLDER}
    webhook-secret: ${CASHFREE_WEBHOOK_SECRET:CHANGE_ME_CASHFREE_WEBHOOK_SECRET_PLACEHOLDER}
    # sandbox for dev/testing, production for live payments
    environment: ${CASHFREE_ENV:sandbox}

  # Shared HMAC secret used to verify the short-lived REG_PAY tokens
  # auth-service mints for the paid maintainer-signup flow. MUST be
  # the same value auth-service uses for `app.jwt.secret` — both
  # services source it from the JWT_SECRET env var in prod.
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_JWT_SECRET_PLACEHOLDER_AT_LEAST_32_BYTES_LONG_ABC}

  maintainer-registration:
    # One-time activation fee for the "I'm a maintainer" signup path.
    # Echoed back to the frontend's paywall card and persisted on the
    # PENDING Payment row.
    fee-inr: ${MAINTAINER_REGISTRATION_FEE_INR:999}
    reconciler:
      # How far back the activation reconciler looks for PAID
      # registration payments whose auth-side activation didn't
      # land. 60 min covers a full Razorpay retry window comfortably.
      lookback-minutes: ${MAINTAINER_REGISTRATION_RECONCILER_LOOKBACK_MIN:60}

  stripe:
    secret-key: ${STRIPE_SECRET:CHANGE_ME_STRIPE_SECRET_KEY_PLACEHOLDER}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:CHANGE_ME_STRIPE_WEBHOOK_SECRET_PLACEHOLDER}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:CHANGE_ME_LOCAL_DEV_EUREKA_PLACEHOLDER}@localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.spa.home_rental_application: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
