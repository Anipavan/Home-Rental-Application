# ════════════════════════════════════════════════════════════════════
#  Production overlay — Anirudh Homes
#
#  Combined from what used to be three separate files:
#    • docker-compose.prod.yml     — Caddy, port stripping, env wiring
#    • docker-compose.tune.yml     — per-service JVM heap caps
#    • compose.bootstrap.yml       — SPRING_FLYWAY_ENABLED=false etc.
#
#  Run via the wrapper script:
#    ./deploy-prod.sh up -d
#
#  Or manually:
#    docker compose --env-file .env-prod \
#                   -f docker-compose-base.yml \
#                   -f docker-compose-prod.yml up -d
#
#  This overlay REPLACES or AUGMENTS keys from docker-compose-base.yml:
#   • Activates the `prod` Spring profile in every service.
#   • Wires every secret to an env var read from .env-prod — no
#     literal credentials.
#   • Disables Flyway + turns on Hibernate DDL-auto=update so schema
#     comes up on fresh boot. Reason: V1__baseline.sql files are
#     no-op stubs; there are no proper CREATE TABLE migrations yet.
#     Change this ONLY when proper V1 migrations exist for every
#     service.
#   • Caps JVM heaps per service so the 2-4GB droplet doesn't OOM.
#   • Removes host port bindings on internal services so only 80/443
#     are reachable from the public internet (Caddy handles ingress).
# ════════════════════════════════════════════════════════════════════

services:

  # ─── Infrastructure services ────────────────────────────────────
  # Close host port bindings. Plain `ports: []` would silently merge
  # with the base file's list — `!reset []` actually clears it.

  mongodb:
    ports: !reset []

  zookeeper:
    ports: !reset []
    environment:
      # cp-zookeeper image reads KAFKA_HEAP_OPTS for its JVM.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"

  kafka:
    ports: !reset []
    environment:
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms384M"

  # ─── Caddy reverse-proxy (TLS termination) ──────────────────────
  # Public entry-point. Terminates TLS on :443, auto-renews
  # Let's Encrypt certs for anirudhhomes.in + www.anirudhhomes.in,
  # and forwards everything to the frontend container.
  #
  # Persistent volumes:
  #   caddy_data   — issued certs + ACME account key. Losing this
  #                  triggers re-issue from scratch on next start
  #                  (Let's Encrypt has a 5-cert/week rate limit).
  #   caddy_config — Caddy's runtime config dump. Safe to lose;
  #                  recreated from Caddyfile on start.

  caddy:
    image: caddy:2-alpine
    container_name: anirudhhomes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hra-net
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Grafana Cloud log shipping (Alloy) ─────────────────────────
  # Ships every container's stdout/stderr to the Grafana Cloud Loki
  # tenant configured in ./grafana-alloy/config.alloy. Auto-discovers
  # containers via the docker socket. Prod-only — dev doesn't ship
  # logs anywhere.
  grafana-alloy:
    image: grafana/alloy:latest
    container_name: hra-grafana-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./grafana-alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hra-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Frontend ────────────────────────────────────────────────────
  # Built from frontend/Dockerfile. nginx inside serves the SPA +
  # reverse-proxies /api/* to api-gateway:8080. NOT bound to host
  # ports in prod — Caddy sits in front and forwards to frontend:80.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/rentals/v1}
        VITE_CSP_CONNECT_SRC: ${VITE_CSP_CONNECT_SRC:-}
    image: anirudhhomes/frontend:${IMAGE_TAG:-latest}
    container_name: anirudhhomes-frontend
    restart: unless-stopped
    ports: !reset []
    networks:
      - hra-net
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Eureka service registry ────────────────────────────────────
  service-registry:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped

  # ─── Config server ──────────────────────────────────────────────
  config-server:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped

  # ─── API Gateway ────────────────────────────────────────────────
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      JAVA_TOOL_OPTIONS: "-Xmx320m -Xms192m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Auth service ───────────────────────────────────────────────
  # Shared env anchor for every JPA-backed service. Merged into each
  # service's `environment:` via `<<: *spring-jpa-env`. Adding a key
  # here propagates to auth / user / property / payment / analytics /
  # kyc / compliance / lease / document / review / maintenance.
  #
  # Flyway is disabled here because the V1__baseline.sql files across
  # services are no-op stubs — Hibernate ddl-auto=update creates the
  # schema on first boot instead. This must stay in sync until proper
  # V1 CREATE TABLE migrations land for every service.
  auth-service:
    environment: &spring-jpa-env
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      APP_FRONTEND_BASE_URL: ${FRONTEND_URL:-https://anirudhhomes.in}
      FRONTEND_URL: ${FRONTEND_URL:-https://anirudhhomes.in}
      APP_AUTH_LOCKOUT_ENABLED: ${APP_AUTH_LOCKOUT_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── User service ──────────────────────────────────────────────
  user-service:
    environment:
      <<: *spring-jpa-env
      # PII-at-rest encryption key — only user-service uses it for
      # bank_accounts.account_number, but listed here so the env
      # contract is explicit at the deploy boundary.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      APP_RETENTION_SOFT_DELETE_DAYS: ${APP_RETENTION_SOFT_DELETE_DAYS:-30}
      APP_RETENTION_ENABLED: ${APP_RETENTION_ENABLED:-true}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Property service ──────────────────────────────────────────
  property-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx320m -Xms192m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Payment service ───────────────────────────────────────────
  payment-service:
    environment:
      <<: *spring-jpa-env
      # Cashfree Easy Split credentials — populate from .env-prod once the
      # Cashfree merchant account is set up (Phase 3 of the split-payment
      # rollout). Until then PAYMENT_GATEWAY=mock keeps payment-service
      # booting cleanly without them.
      APP_CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      APP_CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      APP_CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}
      APP_CASHFREE_ENVIRONMENT: ${CASHFREE_ENV:-sandbox}
      APP_PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Maintenance service ───────────────────────────────────────
  maintenance-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Lease service ─────────────────────────────────────────────
  lease-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Compliance service ────────────────────────────────────────
  compliance-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── KYC service ───────────────────────────────────────────────
  kyc-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Review service ────────────────────────────────────────────
  review-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Notification service (MongoDB-backed) ────────────────────
  # NOT part of *spring-jpa-env because it doesn't have a JPA
  # datasource — Flyway wouldn't run here anyway.
  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      INTERNAL_AUTH_ENABLED: ${INTERNAL_AUTH_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      APP_FRONTEND_BASE_URL: ${FRONTEND_URL:-https://anirudhhomes.in}
      FRONTEND_URL: ${FRONTEND_URL:-https://anirudhhomes.in}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_NOTIFICATION_FROM_EMAIL: ${APP_NOTIFICATION_FROM_EMAIL:-support@anirudhhomes.in}
      APP_NOTIFICATION_FROM_NAME: ${APP_NOTIFICATION_FROM_NAME:-Anirudh Homes}
      APP_TWILIO_ACCOUNT_SID: ${APP_TWILIO_ACCOUNT_SID:-}
      APP_TWILIO_AUTH_TOKEN: ${APP_TWILIO_AUTH_TOKEN:-}
      APP_TWILIO_SMS_FROM: ${APP_TWILIO_SMS_FROM:-}
      APP_TWILIO_WHATSAPP_FROM: ${APP_TWILIO_WHATSAPP_FROM:-}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Document service ──────────────────────────────────────────
  # Replaces the dev bind-mount `./uploads:/uploads` with a named
  # volume so document blobs survive container restarts. For real
  # prod, migrate to S3-compatible object storage.
  document-service:
    environment:
      <<: *spring-jpa-env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    volumes:
      - anirudhhomes-documents:/uploads
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Analytics service ─────────────────────────────────────────
  analytics-service:
    environment:
      <<: *spring-jpa-env
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

# ─── Persistent volumes ────────────────────────────────────────────
volumes:
  anirudhhomes-documents:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
